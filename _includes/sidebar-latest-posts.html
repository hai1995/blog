
<h3>最新文章</h3>
<ul class="list-group latest-posts">
    {% for post in site.posts limit:5 %}
    <li class="list-group-item">
        <a href="{{ site.url }}{{ site.baseurl }}{{ post.url }}" title="{{ post.title }}">
            {{ post.title }}
        </a>
        <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
    {% endfor %}
</ul>
