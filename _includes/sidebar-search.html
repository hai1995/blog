
<h3>搜索文章</h3>
<div id="site_search">
    <input style="width:96%" type="text" id="search_box" placeholder="关键词搜索">
</div>

<ul id="search_results" style="font-size:14px;list-style-type:none;padding-top:10px;padding-left:10px;"></ul>

<script src="{{ assets_base_url }}/assets/js/simple-jekyll-search.min.js"></script>

<script type="text/javascript">
// 获取搜索框和结果容器元素
const searchBox = document.getElementById('search_box');
const searchResults = document.getElementById('search_results');

// 监听搜索框输入事件
searchBox.addEventListener('input', function() {
    // 当有输入内容时显示结果容器
    if (this.value.trim() !== '') {
        searchResults.style.display = 'block';
    } else {
        // 当输入内容为空时隐藏结果容器
        searchResults.style.display = 'none';
    }
});

// 初始化搜索功能
SimpleJekyllSearch({
    searchInput: searchBox,
    resultsContainer: searchResults,
    json: 'https://hai1995.github.io/blog/assets/search_data.json',
    searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}</a></li>',
    noResultsText: 'No results found',
    limit: {{ site.simple_jekyll_search.limit }},
    fuzzy: false,
    exclude: ['Welcome']
})
</script>
